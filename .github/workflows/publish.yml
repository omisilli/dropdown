# A version tag pushed (vX.Y.Z) publishes that version to npm — through
# npm's trusted publishing: GitHub and npm vouch for each other, so no token
# and no one-time code. Set once on npmjs.com, the package's Settings →
# Trusted Publisher: GitHub Actions, omisilli / <this repo>, publish.yml.
name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # for npm's trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      # The tag and package.json must name the same version.
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, but package.json says $version" >&2
            exit 1
          fi

      # Published already — by hand, the first time: nothing to do.
      - name: Already on npm?
        id: published
        run: |
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is on npm already."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # dist is built and committed with each release: published as it is.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
